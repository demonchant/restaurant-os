name: restaurant-os
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: restaurant_os
      POSTGRES_USER: restaurant_os
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-runtime-role.sql:/docker-entrypoint-initdb.d/10-runtime-role.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U restaurant_os -d restaurant_os"], interval: 5s, timeout: 3s, retries: 10 }
    restart: unless-stopped
    networks: [backend]
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis_data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
    restart: unless-stopped
    networks: [backend]
  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://restaurant_os_app:local-runtime-only@postgres:5432/restaurant_os
      REDIS_URL: redis://redis:6379
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)})"], interval: 10s, timeout: 3s, retries: 5 }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [frontend, backend]
  web:
    build: { context: ., dockerfile: infrastructure/docker/web.Dockerfile }
    environment: { NODE_ENV: production, API_URL: "http://api:3001" }
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [frontend]
volumes:
  postgres_data:
  redis_data:
networks:
  frontend:
  backend:
